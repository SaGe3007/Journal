<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Журнал квестов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a2a2f 0%, #0e1a1f 100%);
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            color: #eef4ff;
            height: 100vh;
            overflow: hidden;
            padding: 1.2rem;
        }

        .journal-container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(25, 35, 38, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 1.8rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6);
            border: 1px solid rgba(210, 180, 140, 0.3);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .journal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1.2rem 1.8rem 0.8rem 1.8rem;
            border-bottom: 1px solid #c0a16b;
            background: rgba(20, 30, 32, 0.5);
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #f9e0a0, #e2b870);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .root-add-btn {
            background: #2e5a44;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #faf0cf;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #c9aa6f;
        }
        .root-add-btn:hover {
            background: #3f7259;
            transform: translateY(-2px);
        }

        .two-columns {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 1px;
            background: rgba(0,0,0,0.2);
        }

        .left-panel {
            width: 38%;
            background: rgba(18, 28, 30, 0.7);
            border-right: 1px solid #5f785e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .left-header {
            padding: 1rem 1.2rem 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #e2c089;
            border-bottom: 1px dashed #5f785e;
            letter-spacing: 0.5px;
        }
        .quest-tree {
            flex: 1;
            overflow-y: auto;
            padding: 0.8rem 0.8rem 1rem 1rem;
        }

        .quest-node {
            margin: 0.2rem 0;
            user-select: none;
        }
        .node-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0.4rem 0.4rem 0.4rem 0.2rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: background 0.1s;
            border-left: 3px solid transparent;
        }
        .node-row.active {
            background: #3a5e54;
            border-left-color: #f5cb8b;
            box-shadow: 0 0 6px rgba(0,0,0,0.3);
        }
        .node-row:hover:not(.active) {
            background: #2f4a44;
        }
        .quest-name {
            font-size: 1rem;
            font-weight: 500;
            background: #1f3330;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            color: #fff2df;
            word-break: break-word;
            flex: 1;
        }
        .active-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .action-icon {
            background: #2d4a40;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 2rem;
            color: #f5e2b0;
            transition: 0.1s;
            font-weight: bold;
            border: 1px solid #9b7e54;
        }
        .action-icon:hover {
            background: #4f786a;
            transform: scale(0.96);
        }
        .delete-icon {
            background: #5a3a38;
        }
        .children {
            margin-left: 1.4rem;
            padding-left: 0.5rem;
            border-left: 1px dotted #a58557;
        }

        .right-panel {
            flex: 1;
            background: rgba(20, 32, 34, 0.85);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .desc-header {
            padding: 1rem 1.5rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid #7e9a76;
        }
        .desc-header h3 {
            font-size: 1.4rem;
            font-weight: 500;
            color: #f5e1b0;
            word-break: break-word;
        }
        .desc-content {
            flex: 1;
            padding: 1.2rem 1.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .desc-textarea {
            width: 100%;
            flex: 1;
            background: #1f2f2c;
            border: 1px solid #b99e6e;
            border-radius: 1.2rem;
            color: #faf0dd;
            font-family: inherit;
            font-size: 0.95rem;
            padding: 1rem;
            resize: none;
            outline: none;
        }
        .save-desc-btn {
            align-self: flex-end;
            background: #4f7a64;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.1s;
        }
        .save-desc-btn:hover {
            background: #6d9a82;
        }
        .empty-desc {
            text-align: center;
            margin-top: 3rem;
            color: #b9aa83;
            font-style: italic;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #2c3a38;
        }
        ::-webkit-scrollbar-thumb {
            background: #b98f5a;
            border-radius: 8px;
        }

        @media (max-width: 750px) {
            body { padding: 0.6rem; }
            .left-panel { width: 45%; }
            .quest-name { font-size: 0.85rem; }
            .action-icon { font-size: 0.8rem; padding: 0.1rem 0.4rem; }
        }
    </style>
</head>
<body>
<div class="journal-container">
    <div class="journal-header">
        <h1>📖 Дневник заданий</h1>
        <button class="root-add-btn" id="addRootBtn">✨ Новый квест</button>
    </div>
    <div class="two-columns">
        <div class="left-panel">
            <div class="left-header">📌 Квесты</div>
            <div class="quest-tree" id="questTreeContainer"></div>
        </div>
        <div class="right-panel" id="rightPanel">
            <div class="desc-header">
                <h3 id="selectedQuestTitle">—</h3>
            </div>
            <div class="desc-content">
                <textarea id="questDescriptionText" class="desc-textarea" placeholder="Описание задания..."></textarea>
                <button id="saveDescriptionBtn" class="save-desc-btn">💾 Сохранить описание</button>
            </div>
        </div>
    </div>
</div>

<script>
    const MAX_DEPTH = 5;
    let questsData = [];
    let activeQuestId = null;

    function findNodeById(nodes, targetId, parent = null) {
        for (let i = 0; i < nodes.length; i++) {
            const node = nodes[i];
            if (node.id === targetId) {
                return { node, parent, index: i };
            }
            if (node.children && node.children.length) {
                const deep = findNodeById(node.children, targetId, node);
                if (deep) return deep;
            }
        }
        return null;
    }

    function deleteNodeById(nodes, targetId) {
        for (let i = 0; i < nodes.length; i++) {
            if (nodes[i].id === targetId) {
                nodes.splice(i, 1);
                return true;
            }
            if (nodes[i].children && deleteNodeById(nodes[i].children, targetId)) return true;
        }
        return false;
    }

    function updateNodeTitle(id, newTitle) {
        const found = findNodeById(questsData, id);
        if (found && found.node) {
            found.node.title = newTitle.trim() || "Безымянный";
            return true;
        }
        return false;
    }

    function updateNodeDescription(id, newDesc) {
        const found = findNodeById(questsData, id);
        if (found && found.node) {
            found.node.description = newDesc !== undefined ? newDesc : "";
            return true;
        }
        return false;
    }

    function getNodeDepth(nodeId, nodes, currentDepth = 1) {
        for (const node of nodes) {
            if (node.id === nodeId) return currentDepth;
            if (node.children.length) {
                const d = getNodeDepth(nodeId, node.children, currentDepth + 1);
                if (d) return d;
            }
        }
        return null;
    }

    function addSubQuest(parentId, subTitle, subDesc = "") {
        const found = findNodeById(questsData, parentId);
        if (!found || !found.node) return null;
        const parentDepth = getNodeDepth(parentId, questsData, 1);
        if (parentDepth !== null && parentDepth >= MAX_DEPTH) {
            alert(`Нельзя добавить подзадачу: достигнут лимит вложенности (${MAX_DEPTH} уровней).`);
            return null;
        }
        const newId = `${Date.now()}_${Math.random().toString(36).substr(2, 8)}`;
        const newQuest = {
            id: newId,
            title: subTitle.trim() || "Новая задача",
            description: subDesc,
            children: []
        };
        found.node.children.push(newQuest);
        return newId;
    }

    function addRootQuest(title, description = "") {
        const newId = `root_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
        questsData.push({
            id: newId,
            title: title.trim() || "Новый квест",
            description: description,
            children: []
        });
        return newId;
    }

    function renderLeftPanel() {
        const container = document.getElementById('questTreeContainer');
        if (!container) return;
        if (!questsData.length) {
            container.innerHTML = `<div style="padding: 1.5rem; text-align:center; color:#b9aa83;">📭 Нет квестов. Создайте первый ➕</div>`;
            return;
        }
        const treeHtml = buildTreeHTML(questsData, 1);
        container.innerHTML = treeHtml;
    }

    function buildTreeHTML(nodes, currentDepth) {
        if (!nodes.length) return '';
        let html = '';
        for (const node of nodes) {
            const isActive = (activeQuestId === node.id);
            const safeTitle = escapeHtml(node.title);
            const activeClass = isActive ? 'active' : '';
            const buttonsHtml = isActive ? `
                <div class="active-buttons">
                    <button class="action-icon edit-name-btn" data-id="${node.id}" title="Редактировать название">✏️</button>
                    <button class="action-icon add-sub-btn" data-id="${node.id}" title="Добавить подзадачу">➕</button>
                    <button class="action-icon delete-icon" data-id="${node.id}" title="Удалить квест">🗑️</button>
                </div>
            ` : '';

            html += `
                <div class="quest-node" data-depth="${currentDepth}">
                    <div class="node-row ${activeClass}" data-id="${node.id}">
                        <span class="quest-name">${safeTitle}</span>
                        ${buttonsHtml}
                    </div>
            `;
            if (node.children && node.children.length > 0) {
                html += `<div class="children">${buildTreeHTML(node.children, currentDepth + 1)}</div>`;
            }
            html += `</div>`;
        }
        return html;
    }

    function renderRightPanel() {
        const titleEl = document.getElementById('selectedQuestTitle');
        const textarea = document.getElementById('questDescriptionText');
        if (!titleEl || !textarea) return;
        if (!activeQuestId) {
            titleEl.innerText = '—';
            textarea.value = '';
            textarea.placeholder = 'Выберите квест из списка слева';
            textarea.disabled = true;
            return;
        }
        const found = findNodeById(questsData, activeQuestId);
        if (!found || !found.node) {
            titleEl.innerText = '—';
            textarea.value = '';
            textarea.disabled = true;
            return;
        }
        titleEl.innerText = found.node.title;
        textarea.value = found.node.description || '';
        textarea.placeholder = 'Введите описание квеста...';
        textarea.disabled = false;
    }

    function saveCurrentDescription() {
        if (!activeQuestId) {
            alert('Нет активного квеста');
            return;
        }
        const textarea = document.getElementById('questDescriptionText');
        if (!textarea) return;
        const newDesc = textarea.value;
        updateNodeDescription(activeQuestId, newDesc);
        renderRightPanel();
    }

    function handleLeftPanelClick(e) {
        const nodeRow = e.target.closest('.node-row');
        if (nodeRow && !e.target.closest('.action-icon')) {
            const questId = nodeRow.getAttribute('data-id');
            if (questId) {
                activeQuestId = questId;
                renderLeftPanel();
                renderRightPanel();
            }
            return;
        }

        const editBtn = e.target.closest('.edit-name-btn');
        if (editBtn) {
            const id = editBtn.getAttribute('data-id');
            if (id) {
                const found = findNodeById(questsData, id);
                if (found && found.node) {
                    let newTitle = prompt('Редактирование названия:', found.node.title);
                    if (newTitle !== null && newTitle.trim() !== '') {
                        updateNodeTitle(id, newTitle);
                        renderLeftPanel();
                        if (activeQuestId === id) renderRightPanel();
                    } else if (newTitle !== null && newTitle.trim() === '') {
                        alert('Название не может быть пустым');
                    }
                }
            }
            return;
        }

        const addSubBtn = e.target.closest('.add-sub-btn');
        if (addSubBtn) {
            const parentId = addSubBtn.getAttribute('data-id');
            if (!parentId) return;
            const depth = getNodeDepth(parentId, questsData, 1);
            if (depth !== null && depth >= MAX_DEPTH) {
                alert(`Нельзя добавить подзадачу: максимальный уровень вложенности ${MAX_DEPTH}`);
                return;
            }
            let subTitle = prompt('Название подзадачи:', 'Новое задание');
            if (subTitle === null) return;
            if (subTitle.trim() === '') subTitle = 'Новая задача';
            let subDesc = prompt('Описание (можно пропустить):', '');
            if (subDesc === null) subDesc = '';
            const newSubId = addSubQuest(parentId, subTitle, subDesc);
            if (newSubId) {
                activeQuestId = newSubId;
                renderLeftPanel();
                renderRightPanel();
            }
            return;
        }

        const delBtn = e.target.closest('.delete-icon');
        if (delBtn) {
            const id = delBtn.getAttribute('data-id');
            if (id) {
                const found = findNodeById(questsData, id);
                if (found && found.node) {
                    if (confirm(`Удалить квест "${found.node.title}" и все его подзадачи?`)) {
                        deleteNodeById(questsData, id);
                        if (activeQuestId === id) activeQuestId = null;
                        renderLeftPanel();
                        renderRightPanel();
                    }
                }
            }
            return;
        }
    }

    function handleAddRootQuest() {
        let title = prompt('Название нового квеста:', 'Новое приключение');
        if (title === null) return;
        if (title.trim() === '') title = 'Новый квест';
        let desc = prompt('Описание (необязательно):', '');
        if (desc === null) desc = '';
        const newId = addRootQuest(title, desc);
        activeQuestId = newId;
        renderLeftPanel();
        renderRightPanel();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function init() {
        renderLeftPanel();
        renderRightPanel();
        const treeContainer = document.getElementById('questTreeContainer');
        if (treeContainer) {
            treeContainer.addEventListener('click', handleLeftPanelClick);
        }
        const addRootBtn = document.getElementById('addRootBtn');
        if (addRootBtn) {
            addRootBtn.addEventListener('click', handleAddRootQuest);
        }
        const saveDescBtn = document.getElementById('saveDescriptionBtn');
        if (saveDescBtn) {
            saveDescBtn.addEventListener('click', saveCurrentDescription);
        }
    }

    init();
</script>
</body>
</html>
